    <script>
      // Allow browser extensions to assign window.fetch safely without throwing "only a getter" TypeError
      try {
        let _fetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _fetch; },
          set: function(val) { _fetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {}

      // Prevent third-party browser extension errors from bubbling to the applet
      window.addEventListener('error', function(event) {
        if (event && event.filename && event.filename.includes('chrome-extension://')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
